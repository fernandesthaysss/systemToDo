server.port=8080
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

server.port=${PORT:8080}             # Usa a variável de ambiente PORT, com fallback para 8080
spring.datasource.url=${DB_URL}     # Usa a variável de ambiente DB_URL
spring.datasource.username=${DB_USER} # Usa a variável de ambiente DB_USER
spring.datasource.password=${DB_PASS} # Usa a variável de ambiente DB_PASS

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=quatroevinte
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.datasource.hikari.housekeeping-period-ms=60000

