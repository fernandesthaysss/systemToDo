<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>To-Do List</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="container mt-5">
  <h1 class="text-center">To-Do List</h1>
  <form action="/tasks/add" method="post" class="mb-3">
    <div class="input-group">
      <input type="text" name="description" class="form-control" placeholder="Nova tarefa" required>
      <button type="submit" class="btn btn-primary">Adicionar</button>
    </div>
  </form>

  <ul class="list-group">
    <li th:each="task : ${tasks}" class="list-group-item d-flex justify-content-between align-items-center">
      <span th:text="${task.description}" th:class="${task.completed} ? 'text-decoration-line-through' : ''"></span>
      <div>
        <form action="/tasks/complete" method="post" style="display: inline;">
          <input type="hidden" name="taskId" th:value="${task.id}">
          <button type="submit" class="btn btn-success btn-sm">Concluir</button>
        </form>
        <form action="/tasks/delete" method="post" style="display: inline;">
          <input type="hidden" name="taskId" th:value="${task.id}">
          <button type="submit" class="btn btn-danger btn-sm">Remover</button>
        </form>
      </div>
    </li>
  </ul>
</div>
</body>
</html>
